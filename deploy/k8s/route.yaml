apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tradepilot
  namespace: tradepilot-demo
spec:
  parentRefs:
    - name: app-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames: [reallier.com]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /demos/tradepilot}
      backendRefs:
        - {name: tradepilot, port: 8780}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: tradepilot-limits
  namespace: tradepilot-demo
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: tradepilot
  rateLimit:
    local:
      rules:
        - limit: {requests: 300, unit: Minute}
